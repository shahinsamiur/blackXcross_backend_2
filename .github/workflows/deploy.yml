name: Deploy BlackXcross Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Prisma changes
        id: prisma
        run: |
          if git diff --quiet HEAD^ HEAD -- prisma/ prisma.config.ts; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload source code
        run: |
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='dist/' \
            --exclude='uploads/' \
            --exclude='.env' \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./ \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/blackXcross_backend/current/"

      - name: Deploy on VPS
        run: |
          ssh -i ~/.ssh/deploy_key \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" << 'EOF'
            set -e

            APP_DIR="/var/www/blackXcross_backend"
            CURRENT="$APP_DIR/current"
            SHARED="$APP_DIR/shared"

            cd "$CURRENT"

            echo "Connecting production environment..."
            ln -sfn "$SHARED/.env" "$CURRENT/.env"

            echo "Preparing persistent uploads..."
            mkdir -p "$SHARED/uploads/cases"

            if [ -e "$CURRENT/uploads" ] && [ ! -L "$CURRENT/uploads" ]; then
              rm -rf "$CURRENT/uploads"
            fi

            ln -sfn "$SHARED/uploads" "$CURRENT/uploads"

            echo "Installing dependencies..."
            npm ci

            if [ "${{ steps.prisma.outputs.changed }}" = "true" ]; then
              echo "Prisma changes detected."

              echo "Generating Prisma Client..."
              npx prisma generate

              echo "Syncing database..."
              npx prisma db push --accept-data-loss
            else
              echo "No Prisma changes detected. Skipping Prisma..."
            fi

            echo "Building application..."
            npm run build

            echo "Restarting application..."
            pm2 restart blackxcross-backend || \
              pm2 start dist/src/server.js \
                --name blackxcross-backend

            pm2 save

            echo "Deployment completed successfully."
          EOF

