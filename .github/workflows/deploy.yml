name: Deploy BlackXcross Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build application
        run: npm run build

      - name: Prepare deployment package
        run: |
          mkdir -p deploy-package
          cp -r dist deploy-package/
          cp -r prisma deploy-package/
          cp package.json package-lock.json deploy-package/
          cp -r public deploy-package/

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload deployment package
        run: |
          rsync -az \
            -e "ssh -i ~/.ssh/deploy_key" \
            deploy-package/ \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/blackXcross_backend/current/"

      - name: Deploy on VPS
        run: |
          ssh -i ~/.ssh/deploy_key \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" << 'EOF'
            set -e

            APP_DIR="/var/www/blackXcross_backend"
            CURRENT="$APP_DIR/current"
            SHARED="$APP_DIR/shared"

            cd "$CURRENT"

            echo "Installing production dependencies..."
            npm ci

            echo "Connecting production environment..."
            ln -sfn "$SHARED/.env" "$CURRENT/.env"

            echo "Preparing persistent uploads..."
            mkdir -p "$SHARED/uploads/cases"

            rm -rf "$CURRENT/uploads"
            ln -sfn "$SHARED/uploads" "$CURRENT/uploads"

            echo "Running Prisma migrations..."
            npx prisma migrate deploy

            echo "Restarting application..."
            pm2 restart blackxcross-backend || \
              pm2 start dist/src/server.js \
                --name blackxcross-backend

            pm2 save

            echo "Deployment completed successfully."
          EOF
