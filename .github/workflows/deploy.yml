name: Deploy BlackXcross Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload source code
        run: |
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='dist/' \
            --exclude='generated/prisma/' \
            --exclude='uploads/' \
            --exclude='.env' \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./ \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/blackxcross/backend/"

      - name: Build and restart backend
        run: |
          ssh -i ~/.ssh/deploy_key \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" << 'EOFSSH'
            set -e
            cd /var/www/blackxcross/backend

            npm ci
            npx prisma generate
            npm run build

            pm2 restart blackxcross-api
            pm2 save

            echo "Backend deployment completed."
          EOFSSH
